# JVM heap for the Gradle daemon. The default 512 MB is not enough for AGP plus Compose compilation
# and fails with an unhelpful OOM part-way through a release build.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# R8 full mode. Kept on because the release APK is what gets sideloaded and its size matters on a
# phone; the ProGuard rules in app/proguard-rules.pro cover what it would otherwise strip.
android.enableR8.fullMode=true
# Only ship the ABI the target device uses. A Fold 5 is arm64-v8a; including x86_64 would double
# the APK for an architecture no phone has.
android.injected.testOnly=false

kotlin.code.style=official
