# Conformance corpus — seed set
#
# Schema: schema.json   Docs: ../docs/11, ../docs/12, ../docs/13
# Tiers: T0 bit-exact | T1 full fidelity | T2 preserved | T3 adapted | T4 recovered | T5 blocked
# Recovery rungs: see docs/12-container-conformance.md §5
#
# `status: planned` entries are declared coverage gaps, not omissions. Run runner/coverage.py.

version: 1

defaults:
  platforms: [windows, macos, linux, android, ios, tvos]
  severity: blocking
  expect:
    plays: true
    recovery_rung: 0
    av_sync_ms: { max_drift: 20 }

vectors:

# ─────────────────────────────────────────────────────────────────────────────
# mkv-core — Matroska structural surface
# ─────────────────────────────────────────────────────────────────────────────

- id: mkv-core-lacing-xiph
  group: mkv-core
  title: "Xiph lacing, Vorbis audio"
  spec: ["12#2.2"]
  source: { origin: "matroska.org test suite / generated", license: redistributable }
  properties: { lacing: xiph }
  expect:
    tier: T1
    streams:
      - { type: video, codec: h264 }
      - { type: audio, codec: vorbis, channels: 2 }

- id: mkv-core-lacing-ebml
  group: mkv-core
  title: "EBML lacing"
  spec: ["12#2.2"]
  source: { generate: "mkvmerge --engage use_ebml_lacing …" }
  properties: { lacing: ebml }
  expect: { tier: T1 }

- id: mkv-core-lacing-fixed
  group: mkv-core
  title: "Fixed-size lacing"
  spec: ["12#2.2"]
  source: { generate: "mkvmerge fixed-lacing recipe" }
  properties: { lacing: fixed }
  expect: { tier: T1 }

- id: mkv-core-unknown-size-segment
  group: mkv-core
  title: "Unknown-size Segment and Cluster (live/streamed MKV)"
  spec: ["12#2.1"]
  source: { generate: "ffmpeg -f matroska -live 1 … (piped, no seeking)" }
  properties: { unknown_size: [segment, cluster] }
  expect:
    tier: T1
    notes: "Must play; seeking limited to buffered range and reported as such."

- id: mkv-core-timestampscale-100ns
  group: mkv-core
  title: "Non-default TimestampScale (100 ns)"
  spec: ["12#2.2"]
  source: { generate: "mkvmerge --timestamp-scale 100" }
  properties: { timestamp_scale: 100 }
  expect:
    tier: T1
    duration_s: { value: 10.0, tolerance: 0.02 }
    notes: "Hard-coding the 1 ms default breaks timing entirely."

- id: mkv-core-header-stripping
  group: mkv-core
  title: "ContentCompAlgo=3 header stripping on AVC + AAC"
  spec: ["12#2.7"]
  source: { generate: "mkvmerge --compression 0:header_removal --compression 1:header_removal" }
  properties: { content_compression: header_stripping }
  expect:
    tier: T1
    frame_hashes: golden/mkv-core-header-stripping.txt
    notes: "Unhandled stripping corrupts every frame while still 'playing'. Frame hashes are the only real check."

- id: mkv-core-content-comp-zlib
  group: mkv-core
  title: "ContentCompAlgo=0 zlib-compressed track"
  spec: ["12#2.7"]
  source: { generate: "mkvmerge --compression 0:zlib" }
  expect: { tier: T1 }

- id: mkv-core-blockadditions-hdr10plus
  group: mkv-core
  title: "HDR10+ dynamic metadata carried in BlockAdditions"
  spec: ["12#2.2", "11#6.3"]
  source: { generate: "hdr10plus_tool inject + mkvmerge" }
  properties: { block_additions: hdr10plus, hdr: hdr10plus }
  expect:
    tier: T1
    metadata_present: [hdr10plus_dynamic]
    notes: "Ignoring BlockAdditions silently loses HDR10+. Must be detected, not just tolerated."

- id: mkv-core-blockadditions-dv-rpu
  group: mkv-core
  title: "Dolby Vision RPU in BlockAdditions (P8.1)"
  spec: ["12#2.2", "03#4.1"]
  source: { generate: "dovi_tool + mkvmerge" }
  properties: { block_additions: dv_rpu, dv_profile: "8.1" }
  expect: { tier: T1, metadata_present: [dv_rpu] }

- id: mkv-core-codecdelay-opus
  group: mkv-core
  title: "Opus with CodecDelay and SeekPreRoll"
  spec: ["12#2.2"]
  source: { generate: "ffmpeg -c:a libopus -f matroska" }
  expect:
    tier: T1
    av_sync_ms: { max_drift: 5 }
    notes: "Missing CodecDelay handling produces an audible click and a constant offset."

- id: mkv-core-attached-fonts
  group: mkv-core
  title: "ASS subtitles with 12 attached fonts, wrong MIME types"
  spec: ["12#2.7", "11#5"]
  source: { generate: "mkvmerge --attach-file with deliberately wrong --attachment-mime-type" }
  properties: { attachments: { fonts: 12, mime_correct: false } }
  expect:
    tier: T1
    subtitle_render_hash: golden/mkv-core-attached-fonts.txt
    notes: "Fonts must be detected by magic bytes, not MIME. Wrong font = 'broken subtitles' reports."

- id: mkv-core-display-size-anamorphic
  group: mkv-core
  title: "PixelWidth 720 / DisplayWidth 1024 (anamorphic DAR)"
  spec: ["12#2.6", "11#6.1"]
  source: { generate: "mkvmerge --display-dimensions 0:1024x576" }
  expect:
    tier: T1
    display_aspect: { value: 1.7778, tolerance: 0.01 }

- id: mkv-core-pixelcrop
  group: mkv-core
  title: "PixelCropTop/Bottom/Left/Right set"
  spec: ["12#2.6"]
  source: { generate: "mkvmerge --cropping 0:8,8,8,8" }
  expect:
    tier: T1
    cropped_geometry: { width: 1904, height: 1064 }

- id: mkv-core-colour-element-full
  group: mkv-core
  title: "Complete Colour element incl. MasteringMetadata, MaxCLL, MaxFALL"
  spec: ["12#2.6", "11#6.3"]
  source: { generate: "mkvmerge colour flags, full set" }
  properties: { hdr: hdr10 }
  expect:
    tier: T1
    metadata_present: [mastering_display, max_cll, max_fall, primaries_bt2020, transfer_pq]

- id: mkv-core-legacy-vfw-fourcc
  group: mkv-core
  title: "V_MS/VFW/FOURCC track with BITMAPINFOHEADER in CodecPrivate"
  spec: ["12#2.5"]
  source: { origin: "FATE samples", license: redistributable }
  expect: { tier: T1 }

- id: mkv-core-unknown-codec-track
  group: mkv-core
  title: "One track with an unknown CodecID alongside valid tracks"
  spec: ["12#2.5", "12#1"]
  source: { generate: "hex-patch a CodecID to a private string" }
  expect:
    tier: T1
    streams: [{ type: video, codec: h264 }, { type: audio, codec: aac }]
    notes: "Unknown track is skipped; the file must still play. Never fail the file."

- id: mkv-core-100-tracks
  group: mkv-core
  title: "12 audio + 40 subtitle tracks with mixed flags"
  spec: ["12#2.5", "12#4"]
  source: { generate: "mkvmerge multi-track recipe" }
  expect:
    tier: T1
    selected_audio: { type: audio, language: jpn, flag_original: true }
    selected_subtitle: { type: subtitle, language: eng, flag_forced: true }
    notes: "Also asserts the auto-selection rules in 12#4."

- id: mkv-core-output-sampling-freq-sbr
  group: mkv-core
  title: "HE-AAC with OutputSamplingFrequency = 2x SamplingFrequency"
  spec: ["12#2.6"]
  source: { generate: "HE-AAC in MKV" }
  expect:
    tier: T1
    streams: [{ type: audio, codec: aac, sample_rate: 48000 }]
    notes: "Using SamplingFrequency instead of OutputSamplingFrequency plays at half speed."

- id: mkv-core-encrypted-track
  group: mkv-core
  title: "ContentEncryption on one track, no key"
  spec: ["12#2.7", "11#7"]
  source: { generate: "mkvmerge with ContentEncryption element" }
  expect:
    tier: T5
    message_contains: ["encrypted", "no key"]
    notes: "Must be a specific message, never a mysterious decode failure."

- { id: mkv-core-crc32-mismatch,       group: mkv-core, title: "CRC-32 element present and wrong (must warn, not reject)", spec: ["12#2.1"], status: planned }
- { id: mkv-core-multiple-segments,    group: mkv-core, title: "Two Segments concatenated in one file",                    spec: ["12#2.1"], status: planned }
- { id: mkv-core-projection-360,       group: mkv-core, title: "Projection element, equirectangular 360",                  spec: ["12#2.6"], status: planned }
- { id: mkv-core-stereomode-sbs,       group: mkv-core, title: "StereoMode side-by-side",                                  spec: ["12#2.6"], status: planned }
- { id: mkv-core-tags-hierarchy,       group: mkv-core, title: "Nested Tags with TargetTypeValue 50/60/70",                spec: ["12#2.7"], status: planned }

# ─────────────────────────────────────────────────────────────────────────────
# mkv-chapters — the area with the worst cross-player support
# ─────────────────────────────────────────────────────────────────────────────

- id: mkv-chapters-ordered-basic
  group: mkv-chapters
  title: "EditionFlagOrdered with skipped regions"
  spec: ["12#2.4"]
  source: { origin: "hubblec4/Matroska-Playback", license: redistributable }
  expect:
    tier: T1
    virtual_timeline_duration_s: { value: 8.0, tolerance: 0.05 }
    notes: "Virtual timeline must exclude non-included regions; duration reflects the edition, not the file."

- id: mkv-chapters-segment-uid-hardlink
  group: mkv-chapters
  title: "ChapterSegmentUID referencing a sibling file"
  spec: ["12#2.4"]
  source: { origin: "hubblec4/Matroska-Playback", license: redistributable }
  properties: { linking: hard, files: 2 }
  expect:
    tier: T1
    notes: "Requires scanning siblings and building a SegmentUID -> path map."

- id: mkv-chapters-segment-edition-uid
  group: mkv-chapters
  title: "ChapterSegmentEditionUID — entire linked edition played, chapter times ignored"
  spec: ["12#2.4"]
  source: { origin: "hubblec4/Matroska-Playback", license: redistributable }
  expect:
    tier: T1
    notes: >
      Per spec the whole linked edition plays and the chapter's start/end times are ignored;
      its full duration integrates into the virtual timeline. Commonly implemented wrong.

- id: mkv-chapters-linking-loop
  group: mkv-chapters
  title: "Segment linking that forms an endless loop"
  spec: ["12#2.4"]
  source: { origin: "hubblec4/Matroska-Playback", license: redistributable }
  severity: blocking
  expect:
    tier: T4
    plays: true
    timeout_s: 30
    message_contains: ["circular", "link"]
    notes: "A player without cycle detection hangs or OOMs. Must break the cycle, play what resolves, and warn."

- id: mkv-chapters-missing-linked-file
  group: mkv-chapters
  title: "Hard link to a Segment UID that is not present"
  spec: ["12#2.4"]
  source: { generate: "delete the sibling of mkv-chapters-segment-uid-hardlink" }
  expect:
    tier: T4
    plays: true
    message_contains: ["linked segment", "not found"]
    notes: "Must play the resolvable portion. Never abort."

- id: mkv-chapters-multi-edition
  group: mkv-chapters
  title: "Three editions with EditionFlagDefault on the second"
  spec: ["12#2.4"]
  source: { generate: "mkvmerge --chapters with multiple EditionEntry" }
  expect:
    tier: T1
    selected_edition: 2
    editions_exposed: 3

- { id: mkv-chapters-nested,          group: mkv-chapters, title: "Nested ChapterAtom tree",                        spec: ["12#2.4"], status: planned }
- { id: mkv-chapters-hidden,          group: mkv-chapters, title: "ChapterFlagHidden / ChapterFlagEnabled",          spec: ["12#2.4"], status: planned }
- { id: mkv-chapters-multilang,       group: mkv-chapters, title: "ChapterDisplay in 5 languages",                   spec: ["12#2.4"], status: planned }
- { id: mkv-chapters-softlink-prevnext, group: mkv-chapters, title: "PrevUID/NextUID soft linking across 3 files",   spec: ["12#2.4"], status: planned }
- { id: mkv-chapters-ordered-nocues,  group: mkv-chapters, title: "Ordered chapters with no Cues",                    spec: ["12#2.3"], status: planned }
- { id: mkv-chapters-deep-chain,      group: mkv-chapters, title: "Link chain 20 segments deep (depth cap)",          spec: ["12#2.4"], status: planned }

# ─────────────────────────────────────────────────────────────────────────────
# mkv-damage
# ─────────────────────────────────────────────────────────────────────────────

- id: mkv-damage-no-cues
  group: mkv-damage
  title: "Cues element removed entirely"
  spec: ["12#2.3", "12#5"]
  source: { generate: "strip Cues from a valid MKV" }
  expect:
    tier: T1
    recovery_rung: 2
    seekable: true
    notes: "Seeking must still work via cluster scan. Disabling seek is a failure."

- id: mkv-damage-cues-wrong-offsets
  group: mkv-damage
  title: "Cues present with offsets that do not land on clusters"
  spec: ["12#2.3"]
  source: { generate: "corrupt CueClusterPosition values" }
  expect:
    tier: T4
    recovery_rung: 2
    seekable: true
    notes: "Must validate element ID at the target and fall back to scanning."

- id: mkv-damage-truncated-mid-cluster
  group: mkv-damage
  title: "File truncated at 60% mid-cluster"
  spec: ["12#2.8", "12#5"]
  source: { generate: "truncate -s 60%" }
  expect:
    tier: T4
    plays: true
    recovery_rung: 2
    duration_reported: approximate

- id: mkv-damage-broken-ebml-header
  group: mkv-damage
  title: "First 4 KB zeroed (EBML header destroyed)"
  spec: ["12#2.1", "12#5"]
  source: { generate: "dd zero the first 4096 bytes" }
  expect:
    tier: T4
    plays: true
    recovery_rung: 4
    notes: "Must scan forward for the first valid Cluster and start there."

- id: mkv-damage-garbage-between-clusters
  group: mkv-damage
  title: "2 KB of random bytes injected between clusters"
  spec: ["12#2.8"]
  source: { generate: "byte injection at cluster boundaries" }
  expect: { tier: T4, plays: true, recovery_rung: 2 }

- { id: mkv-damage-bad-seekhead,      group: mkv-damage, title: "SeekHead offsets point into mdat-equivalent",  spec: ["12#2.3"], status: planned }
- { id: mkv-damage-no-duration,       group: mkv-damage, title: "Duration element absent",                      spec: ["12#2.8"], status: planned }
- { id: mkv-damage-poor-interleave,   group: mkv-damage, title: "All video then all audio (no interleave)",     spec: ["12#2.8"], status: planned }
- { id: mkv-damage-dup-timestamps,    group: mkv-damage, title: "Duplicate blocks at identical timestamps",     spec: ["12#2.8"], status: planned }
- { id: mkv-damage-concatenated,      group: mkv-damage, title: "Two complete MKVs cat'd together",             spec: ["12#2.8"], status: planned }

# ─────────────────────────────────────────────────────────────────────────────
# mp4-core
# ─────────────────────────────────────────────────────────────────────────────

- id: mp4-core-elst-empty-edit
  group: mp4-core
  title: "Empty edit list entry (initial audio delay) — the classic A/V sync trap"
  spec: ["12#3.2", "12#6"]
  source: { generate: "MP4Box -add with an empty edit on the audio track" }
  properties: { edit_list: empty_edit, delay_ms: 120 }
  expect:
    tier: T1
    av_sync_ms: { max_drift: 10 }
    notes: "Ignoring elst puts audio 120 ms early. Most common MP4 sync bug in the wild."

- id: mp4-core-elst-media-offset
  group: mp4-core
  title: "Edit list with media start offset (trim)"
  spec: ["12#3.2"]
  source: { generate: "MP4Box edit list with media_time > 0" }
  expect:
    tier: T1
    first_frame_pts_s: { value: 0.0, tolerance: 0.01 }

- id: mp4-core-elst-multiple-and-dwell
  group: mp4-core
  title: "Multiple edits including a dwell (media_rate = 0)"
  spec: ["12#3.2"]
  source: { generate: "hand-built elst" }
  expect: { tier: T1 }

- id: mp4-core-ctts-v1-signed
  group: mp4-core
  title: "ctts version 1 with negative composition offsets"
  spec: ["12#3.2"]
  source: { generate: "x264-style negative-ctts muxing" }
  expect:
    tier: T1
    first_frame_pts_s: { value: 0.0, tolerance: 0.01 }
    notes: "Must normalize to zero-based while preserving relative offsets."

- id: mp4-core-multiple-stsd
  group: mp4-core
  title: "Two stsd entries — resolution changes mid-file"
  spec: ["12#3.3"]
  source: { generate: "concatenate two resolutions into one track" }
  expect:
    tier: T1
    resolution_changes: 1
    notes: "Renderer must reconfigure without stopping playback."

- id: mp4-core-avc3-inband-params
  group: mp4-core
  title: "avc3 sample entry, in-band SPS/PPS only"
  spec: ["12#3.3"]
  source: { generate: "MP4Box -inband" }
  expect: { tier: T1 }

- id: mp4-core-hev1-inband-params
  group: mp4-core
  title: "hev1 sample entry, in-band VPS/SPS/PPS"
  spec: ["12#3.3"]
  source: { generate: "MP4Box -inband HEVC" }
  expect: { tier: T1 }

- id: mp4-core-mdat-before-moov
  group: mp4-core
  title: "Non-faststart layout, served over HTTP"
  spec: ["12#3.1"]
  source: { generate: "ffmpeg without +faststart" }
  properties: { layout: mdat_first, transport: http }
  expect:
    tier: T1
    bytes_read_before_first_frame: { max: 8388608 }
    notes: "Must range-request the tail for moov. Downloading the whole file to start is a failure."

- id: mp4-core-mdat-size-zero
  group: mp4-core
  title: "Final mdat with size == 0 (extends to EOF)"
  spec: ["12#3.1"]
  source: { generate: "patch mdat size to 0" }
  expect: { tier: T1 }

- id: mp4-core-qt-pcm-twos
  group: mp4-core
  title: "QuickTime 'twos' big-endian PCM, 5.1, with chan layout box"
  spec: ["12#3.3"]
  source: { origin: "FATE samples", license: redistributable }
  expect:
    tier: T0
    streams: [{ type: audio, codec: pcm_s16be, channels: 6 }]

- id: mp4-core-chapters-three-ways
  group: mp4-core
  title: "Chapters via tref-chap text track, Nero chpl, and ilst — all in one file"
  spec: ["12#3.5"]
  source: { generate: "MP4Box + mp4chaps" }
  expect:
    tier: T1
    chapters_count: 12
    notes: "Different tools write different mechanisms; all three must be readable."

- id: mp4-core-clap-pasp
  group: mp4-core
  title: "clap (clean aperture) + pasp (non-square pixels) together"
  spec: ["12#3.3", "11#6.1"]
  source: { generate: "MP4Box -par and clap injection" }
  expect:
    tier: T1
    display_aspect: { value: 1.7778, tolerance: 0.01 }

- id: mp4-core-dv-profile5
  group: mp4-core
  title: "Dolby Vision Profile 5, dvh1 sample entry with dvcC"
  spec: ["12#3.3", "03#4.1"]
  source: { generate: "dovi_tool + MP4Box" }
  expect:
    tier: T1
    metadata_present: [dv_rpu]
    notes: "P5 has no HDR10-compatible base; must not render green/purple."

- id: mp4-core-implicit-sbr
  group: mp4-core
  title: "HE-AAC with implicit SBR signalling"
  spec: ["12#3.3"]
  source: { origin: "FATE samples", license: redistributable }
  expect:
    tier: T1
    streams: [{ type: audio, codec: aac, sample_rate: 44100 }]
    notes: "Implicit SBR misdetection plays at half speed."

- id: mp4-core-no-ftyp
  group: mp4-core
  title: "QuickTime file with no ftyp box"
  spec: ["12#3.5", "12#1"]
  source: { generate: "strip ftyp" }
  expect: { tier: T1, recovery_rung: 1 }

- id: mp4-core-open-gop-sgpd
  group: mp4-core
  title: "Open-GOP HEVC with sgpd/sbgp roll groups"
  spec: ["12#3.2"]
  source: { generate: "open-GOP encode + MP4Box" }
  expect:
    tier: T1
    seek_clean: true
    notes: "Ignoring roll distance produces corrupt frames after a seek."

- id: mp4-core-drm-cenc
  group: mp4-core
  title: "CENC-encrypted MP4 with pssh, no key"
  spec: ["12#3.6", "11#7"]
  source: { generate: "MP4Box -crypt" }
  expect:
    tier: T5
    message_contains: ["DRM", "cenc"]
    notes: "Must identify the scheme by name. Never decode garbage."

- { id: mp4-core-wrong-extension,     group: mp4-core, title: "MP4 content in a file named .mkv",              spec: ["12#1"],   status: planned }
- { id: mp4-core-mlpa-truehd,         group: mp4-core, title: "TrueHD in MP4 (mlpa sample entry)",             spec: ["12#3.3"], status: planned }
- { id: mp4-core-reference-movie,     group: mp4-core, title: "QuickTime reference movie (rmra/rdrf)",         spec: ["12#3.5"], status: planned }
- { id: mp4-core-timescale-mismatch,  group: mp4-core, title: "Track timescale 1001 vs movie timescale 600",   spec: ["12#3.2"], status: planned }
- { id: mp4-core-stss-absent,         group: mp4-core, title: "All-intra ProRes with no stss",                 spec: ["12#3.2"], status: planned }
- { id: mp4-core-gpmf-metadata,       group: mp4-core, title: "GoPro GPMF timed-metadata track present",       spec: ["12#3.5"], status: planned }

