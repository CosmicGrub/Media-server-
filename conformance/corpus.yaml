# ─────────────────────────────────────────────────────────────────────────────
# mp4-damage
# ─────────────────────────────────────────────────────────────────────────────

- id: mp4-damage-no-moov
  group: mp4-damage
  title: "Recording interrupted — mdat present, moov never written"
  spec: ["12#3.7", "12#5"]
  severity: blocking
  source: { generate: "truncate a non-faststart MP4 before moov" }
  expect:
    tier: T4
    plays: true
    recovery_rung: 4
    notes: >
      Must reconstruct sample tables by scanning mdat for codec sync patterns (the untrunc technique).
      These are irreplaceable user files — phone/camera crashes. Highest-value recovery case.

