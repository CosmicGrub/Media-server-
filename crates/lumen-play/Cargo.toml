[package]
name = "lumen-play"
description = "Runnable player and library test harness: scan a collection, play it through mpv, and record what actually worked."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
lumen-model.workspace = true
lumen-caps.workspace = true
lumen-playback.workspace = true
lumen-probe.workspace = true
lumen-match.workspace = true
lumen-identity.workspace = true
lumen-index.workspace = true
lumen-discovery.workspace = true
lumen-segment.workspace = true
# Only for `lumen serve`'s pairing codes and tokens. `unsafe_code` is denied workspace-wide, which
# rules out reading a platform random source by hand, and std has no CSPRNG of its own to reach for.
getrandom = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
sha2 = "0.10"
# `rcgen`'s own `not_before`/`not_after` fields are typed `time::OffsetDateTime`, and `time` is
# already in the dependency graph as one of rcgen's own dependencies -- naming it directly here adds
# nothing new to the license gate or the build matrix, same reasoning as reusing `xxhash-rust` for
# Engine B's digest. Only `from_unix_timestamp`, a `const fn` needing no feature at all, is used.
time = { version = "0.3", default-features = false }
# `lumen serve health`'s free-disk-space check (docs/15 §D): `unsafe_code` is denied workspace-wide,
# which rules out a hand-rolled `statvfs`/`GetDiskFreeSpaceExW` call the same way `getrandom` above
# was needed for the OS random source. Every platform backend this pulls in (`rustix`, `windows-sys`)
# is already in the dependency graph via `rustls`/`getrandom`, so this adds no new transitive crate.
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }

[target.'cfg(windows)'.dependencies]
# `ipc.rs`'s Windows named-pipe transport: two `File`s duplicated from one `CreateFileW` handle (via
# `try_clone`) deadlocked the moment a real command was sent, because Windows serializes synchronous
# (non-overlapped) I/O per file object -- a pending read on one duplicated handle blocks a write on
# the other, and mpv was never going to reply until it received that write. `unsafe_code` is denied
# workspace-wide, which rules out driving Windows' overlapped I/O by hand the same way `getrandom`
# above was needed for the OS random source; this crate's named-pipe support gives each split half
# its own overlapped I/O state so a read and a write on the same connection genuinely don't contend.
# `default-features = false` keeps it to plain synchronous named pipes -- no tokio, no async runtime.
interprocess = { version = "2.4.3", default-features = false }

[lints]
workspace = true
