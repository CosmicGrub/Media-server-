name: Desktop release

# Builds the desktop player for Windows, Linux and macOS and uploads each as a downloadable
# artifact. Trigger with `workflow_dispatch`, or by pushing a `v*` tag.
#
# Built natively on each runner rather than cross-compiled from one. Cross-compiling to Windows
# works — `crates/lumen-play/package-windows.sh` does it — but it silently skips the Windows-only
# code paths, and the named-pipe IPC transport is exactly the kind of thing that compiles under
# `#[cfg(windows)]` on a Linux host and fails to link on a real one.

on:
  push:
    tags: ['v*']
  # A release pipeline that is only exercised at tag time is one that breaks at tag time, when it is
  # least convenient. Changing this file revalidates it against an open pull request, so a mistake
  # surfaces on the commit that caused it rather than during a release.
  #
  # NOT YET EXERCISED END TO END. `workflow_dispatch` requires the workflow to already be
  # registered on the repository's default branch — confirmed by trying it from this branch
  # (`gh api ... /actions/workflows/release.yml/dispatches` → 404, since it only exists here) — and
  # this session's git proxy rejects tag pushes, so neither route is available yet. Once it is on
  # `main`, verify it before relying on it:
  #     gh workflow run release.yml --ref main
  # The per-platform `cargo build --release` it performs is covered by rust.yml on all three
  # operating systems, including the two properties this file's own steps additionally check for
  # Windows specifically (target-feature=+crt-static needing no VC++ Redistributable, and the
  # bundled mpv's codec coverage) — rust.yml exercises both of those for real on windows-latest too,
  # against a debug build fetched via the actual `lumen setup` path rather than this file's release
  # build. What is still unverified here, specifically, is the staging, packaging and zip layout
  # this file performs around all of that.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'crates/lumen-play/**'
  workflow_dispatch:
    inputs:
      bundle_mpv:
        description: 'Bundle mpv into the Windows zip (adds ~30 MB)'
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: lumen.exe
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: lumen
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: lumen
          # Intel Macs are still in use and the runner can target them from the same host.
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: lumen

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p lumen-play --target ${{ matrix.target }}

      # A release binary that was never run is a release binary nobody has tested. `--version` is
      # the cheapest possible proof that it links and starts on this platform.
      - name: Verify the binary runs
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          ls -l "$BIN"
          # Skip execution when the target is not the host — an aarch64 binary will not run on the
          # x86_64 runner, and failing there would be a false negative.
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] && [ "$(uname -m)" = "arm64" ]; then
            echo "cross-target build; skipping execution"
          else
            "$BIN" --version
          fi

      # `.cargo/config.toml` statically links the MSVC CRT for this target specifically, so
      # lumen.exe needs no Visual C++ Redistributable on the machine that runs it — checked here
      # rather than assumed, the same evidence-over-assumption approach `package-windows.sh` already
      # uses (it objdumps the mingw-gnu build for exactly this class of missing dependency).
      - name: Set up MSVC dev tools (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify lumen.exe needs no VC++ Redistributable (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          $deps = (dumpbin /dependents $bin | Out-String)
          Write-Host $deps
          # If either of these shows up, target-feature=+crt-static silently stopped applying and
          # the binary is back to needing the redistributable installed on the target machine —
          # which would surface as a "VCRUNTIME140.dll was not found" dialog on a bare Windows
          # install, a worse first impression than any error this program prints itself.
          if ($deps -match 'VCRUNTIME|MSVCP\d') {
            throw "lumen.exe still imports a VC++ runtime DLL -- target-feature=+crt-static is not taking effect. See dumpbin output above."
          }
          Write-Host 'OK -- no VCRUNTIME/MSVCP dependency; the Visual C++ Redistributable is not required'

      - name: Stage the bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/lumen-${{ matrix.name }}"
          mkdir -p "$OUT"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$OUT/"
          cp crates/lumen-play/README.md "$OUT/README.md"
          cp LICENSE "$OUT/LICENSE" 2>/dev/null || true

      # Only Windows gets a bundled player. mpv on Windows is one statically linked exe; on Linux
      # and macOS it is a dynamically linked package with a long dependency chain, and shipping that
      # correctly means shipping a distribution — which is what the package manager already is.
      - name: Bundle mpv (Windows)
        # Bundles on tag pushes and on pull-request validation; only an explicit dispatch can turn
        # it off. The download and 7z extraction are the most fragile steps here, so skipping them
        # during validation would leave the part most likely to break unexercised.
        if: matrix.os == 'windows-latest' && (github.event_name != 'workflow_dispatch' || inputs.bundle_mpv)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $out = "dist/lumen-${{ matrix.name }}"
          $tmp = Join-Path $env:RUNNER_TEMP "mpv"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          # SourceForge has been observed serving a small mirror-selection/rate-limit page instead of
          # the archive to requests that look scripted; a plain browser-like UA avoids it in
          # practice, and the GitHub fallback below covers the rest.
          $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) lumen-release'

          Write-Host 'Locating the latest mpv build...'
          $candidates = @()
          try {
            $listing = Invoke-WebRequest -UseBasicParsing -UserAgent $ua -Uri 'https://sourceforge.net/projects/mpv-player-windows/files/release/'
            $vers = [regex]::Matches($listing.Content, 'mpv-(\d+\.\d+\.\d+)-x86_64\.7z') |
                    ForEach-Object { $_.Groups[1].Value } | Sort-Object { [version]$_ } -Unique
            if ($vers) {
              $v = $vers[-1]
              Write-Host "  mpv $v (sourceforge)"
              $candidates += "https://sourceforge.net/projects/mpv-player-windows/files/release/mpv-$v-x86_64.7z/download"
            }
          } catch { Write-Host '  sourceforge lookup failed' }
          try {
            $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest' -Headers @{ 'User-Agent' = 'lumen' }
            $a = $rel.assets | Where-Object { $_.name -like 'mpv-x86_64-2*' -and $_.name -like '*.7z' -and $_.name -notlike '*v3*' } | Select-Object -First 1
            if ($a) { Write-Host "  $($a.name) (github)"; $candidates += $a.browser_download_url }
          } catch { }
          if (-not $candidates) { throw 'no mpv download source found' }

          # A 7-Zip archive always opens with this six-byte signature. Checking that, rather than a
          # size threshold, is what actually tells "the real archive" apart from some other small
          # response that happened to clear an arbitrary byte count — a rate-limit page is not
          # guaranteed to land under any particular size.
          function Test-SevenZipSignature($path) {
            $sig = [byte[]](0x37, 0x7A, 0xBC, 0xAF, 0x27, 0x1C)
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt $sig.Length) { return $false }
            for ($i = 0; $i -lt $sig.Length; $i++) { if ($bytes[$i] -ne $sig[$i]) { return $false } }
            return $true
          }

          $archive = Join-Path $tmp 'mpv.7z'
          $downloaded = $false
          foreach ($url in $candidates) {
            try {
              Write-Host "Downloading from $url ..."
              Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing -UserAgent $ua
              if (Test-SevenZipSignature $archive) { $downloaded = $true; break }
              Write-Host '  not a real 7-Zip archive (likely a mirror-selection or rate-limit page) -- trying the next source'
            } catch {
              Write-Host "  download failed: $($_.Exception.Message) -- trying the next source"
            }
          }
          if (-not $downloaded) { throw 'every mpv download source returned something that was not a real archive' }

          & 7z x $archive ("-o" + $tmp) -y | Out-Null
          $mpv = Get-ChildItem -Path $tmp -Filter mpv.exe -Recurse | Select-Object -First 1
          if (-not $mpv) { throw 'no mpv.exe in the archive' }
          Copy-Item $mpv.FullName $out -Force
          $d3d = Get-ChildItem -Path $tmp -Filter 'd3dcompiler_*.dll' -Recurse | Select-Object -First 1
          if ($d3d) { Copy-Item $d3d.FullName $out -Force }

          # Proof the pair works together, which is the only thing that makes this a bundle rather
          # than two files in a folder.
          & "$out/lumen.exe" doctor
          Write-Host "mpv bundled: $((Get-Item "$out/mpv.exe").Length / 1MB) MB"

      # "All dependencies and appropriate codecs included" checked, not assumed. This is the bundle's
      # real advantage over the Android build: TrueHD, DTS-HD MA, DTS and DTS:X don't decode there
      # because that's gated on an OEM licensing a hardware or software decoder that mostly does not
      # exist on a phone, but this mpv's statically linked FFmpeg carries its own software decoder for
      # every one of them — nothing here is limited by what Windows itself ships. Same
      # evidence-over-assumption approach as the DLL-import check above and `package-windows.sh`'s
      # own objdump check: read what mpv actually reports it can decode, rather than trust that the
      # build fetched still has what an earlier release verified.
      - name: Verify codec coverage (Windows)
        if: matrix.os == 'windows-latest' && (github.event_name != 'workflow_dispatch' || inputs.bundle_mpv)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "dist/lumen-${{ matrix.name }}"
          $mpv = "$out/mpv.exe"

          $video = (& $mpv --vd=help 2>&1 | Out-String)
          $audio = (& $mpv --ad=help 2>&1 | Out-String)
          Write-Host "== video decoders =="
          Write-Host $video
          Write-Host "== audio decoders =="
          Write-Host $audio

          # dca is FFmpeg's decoder name for DTS (Digital Theater Systems, historical), and covers
          # the DTS-HD MA and DTS:X extensions losslessly, not just the DTS core.
          $requiredVideo = 'h264', 'hevc', 'vp9', 'av1', 'mpeg2video', 'vc1'
          $requiredAudio = 'ac3', 'eac3', 'dca', 'truehd', 'flac', 'aac', 'opus', 'mp3'

          $missing = @()
          foreach ($c in $requiredVideo) { if ($video -notmatch [regex]::Escape($c)) { $missing += "video:$c" } }
          foreach ($c in $requiredAudio) { if ($audio -notmatch [regex]::Escape($c)) { $missing += "audio:$c" } }

          if ($missing.Count -gt 0) {
            throw "bundled mpv is missing expected decoders: $($missing -join ', ')"
          }
          Write-Host 'OK -- full video and audio codec set present, including TrueHD and DTS-HD MA (dca)'

      - name: Add the quick-start note
        shell: bash
        run: |
          OUT="dist/lumen-${{ matrix.name }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cat > "$OUT/START-HERE.txt" <<'TXT'
          lumen - media library player and test harness

          Nothing to install. lumen.exe's C runtime is statically linked (no Visual C++
          Redistributable needed) and mpv.exe's FFmpeg is statically linked with its own software
          decoders for every codec this product supports, TrueHD and DTS-HD MA included -- CI checks
          both of those on every build rather than assuming they still hold.

          1. Open PowerShell in this folder (Shift+right-click > "Open PowerShell window here").

          2. Check the machine:
                 .\lumen.exe doctor

             If mpv is missing, run:
                 .\lumen.exe setup

          3. Look at your library without playing anything:
                 .\lumen.exe scan "D:\Media"

          4. Test it - opens every file briefly and reports which ones fail:
                 .\lumen.exe test "D:\Media" --limit 5
                 .\lumen.exe test "D:\Media" --json report.json

          5. Watch:
                 .\lumen.exe play "D:\Media"

          Playback controls are mpv's own: space, arrows, f, q.
          Exit codes: 0 all played, 1 something failed, 2 setup problem.
          TXT
          else
            cat > "$OUT/START-HERE.txt" <<'TXT'
          lumen - media library player and test harness

          mpv is the one prerequisite:
              macOS   brew install mpv
              Linux   apt install mpv     (or dnf / pacman / zypper)

          Then:
              ./lumen doctor
              ./lumen scan  ~/Media
              ./lumen test  ~/Media --limit 5 --json report.json
              ./lumen play  ~/Media

          If mpv is somewhere unusual, point at it instead of moving it:
              export LUMEN_MPV=/path/to/mpv

          Playback controls are mpv's own: space, arrows, f, q.
          Exit codes: 0 all played, 1 something failed, 2 setup problem.
          TXT
            chmod +x "$OUT/lumen"
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "lumen-${{ matrix.name }}.zip" "lumen-${{ matrix.name }}" > /dev/null
          else
            tar czf "lumen-${{ matrix.name }}.tar.gz" "lumen-${{ matrix.name }}"
          fi
          ls -lh lumen-${{ matrix.name }}.*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ matrix.name }}
          path: |
            dist/lumen-${{ matrix.name }}.zip
            dist/lumen-${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 30
