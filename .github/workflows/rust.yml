name: Rust

# Tests, lints and formatting for the Rust workspace — the desktop player and every crate under it.
#
# Runs on all three desktop platforms because the player is platform-specific in exactly the places
# that matter: the mpv IPC transport is a Unix socket on Linux/macOS and a named pipe on Windows,
# the environment probe shells out to different tools per OS, and path handling differs. A
# Linux-only CI would let a Windows-only break reach a release unnoticed.

on:
  push:
    paths:
      - 'crates/**'
      - 'spikes/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

  # No `pull_request` trigger: every PR in this repo is a same-repo branch -> main (or -> the shared
  # development branch), so `push` above already runs this exact commit's checks. A `pull_request` run
  # would be a second full three-platform matrix, on paid-tier Windows/macOS runners, for the same
  # commit and the same answer -- see `release.yml`'s `on:` block for the fuller version of this
  # reasoning, which applies here identically.

permissions:
  contents: read

# Cancel a still-running run for the same branch the moment a newer push arrives, so three fixes
# pushed minutes apart don't each burn a full paid-tier matrix to completion when only the last one's
# result was ever going to matter.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI only. Locally a warning should not block an edit-compile cycle; in CI it
  # is the difference between a clean tree and a slow accumulation nobody ever goes back to fix.
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other platforms when one fails. Knowing whether a break is
      # Windows-specific or universal is most of the diagnosis, and that is lost if the run aborts.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # `remote_serve.rs` has a real integration test that pairs, plays, seeks and reads state back
      # from an actual mpv process — but it self-skips ("mpv is not on PATH") rather than failing
      # when mpv is absent, so it can run in a plain `cargo test` locally without every contributor
      # installing mpv first. That default-skip means it has almost certainly never executed for
      # real on any GitHub-hosted runner: nothing before this line ever put mpv on PATH. Installing
      # it here, before Build/Test, is what turns "compiles, and the test didn't complain" into
      # "a real mpv process was actually driven end to end."
      - name: Install mpv (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq mpv
          else
            brew install mpv
          fi

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # On windows-latest mpv is still absent here (the fetch happens further down), which is itself
      # worth exercising: `doctor` must report the absence and exit 2 rather than panicking. On
      # Linux/macOS mpv is already installed above, so `doctor` finding it and exiting 0 is the
      # expected outcome there instead -- either is accepted below, per platform.
      - name: Smoke test the CLI
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(cargo run -q -p lumen-play -- --version)
          echo "$BIN"
          echo "$BIN" | grep -q "^lumen "

          # A missing mpv must be reported, not crashed on.
          set +e
          cargo run -q -p lumen-play -- doctor > doctor.txt 2>&1
          code=$?
          set -e
          cat doctor.txt
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then
            echo "doctor exited $code; expected 0 (mpv present) or 2 (mpv absent)" >&2
            exit 1
          fi

          # Scanning a tree with no media must succeed and report nothing, not error.
          mkdir -p empty-lib
          cargo run -q -p lumen-play -- scan empty-lib

      # `lumen setup`'s download path (real sourceforge/github fetch, real 7z extraction) has never
      # actually run anywhere before this — it is only reachable when mpv is not already on the
      # machine, and every other CI job either has mpv preinstalled (the apt package on Linux, in
      # release.yml's case a separately-downloaded copy) or skips this entirely. A bare
      # windows-latest runner has no mpv, which makes it the one place this path gets exercised for
      # real rather than assumed to work because the PowerShell inside it reads correctly.
      #
      # Also checks the thing "appropriate codecs included" actually means: the fetched mpv's own
      # reported decoder list, not the upstream build's reputation. TrueHD and DTS-HD MA (FFmpeg
      # calls its DTS decoder `dca`) don't decode on the Android build because that is gated on OEM
      # hardware/software licensing that mostly does not exist on a phone — this desktop build has no
      # such gate, since FFmpeg's own software decoders cover all of them, and this is what checks
      # that rather than assuming it.
      - name: Fetch mpv via lumen setup and verify codec coverage (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cargo run -q -p lumen-play -- setup
          if ($LASTEXITCODE -ne 0) { throw "lumen setup failed with exit code $LASTEXITCODE" }

          $mpv = 'target/debug/mpv.exe'
          if (-not (Test-Path $mpv)) { throw 'lumen setup reported success but target/debug/mpv.exe is missing' }

          Write-Host '== lumen doctor now finds it =='
          cargo run -q -p lumen-play -- doctor

          $video = (& $mpv --vd=help 2>&1 | Out-String)
          $audio = (& $mpv --ad=help 2>&1 | Out-String)
          Write-Host "== video decoders =="
          Write-Host $video
          Write-Host "== audio decoders =="
          Write-Host $audio

          $requiredVideo = 'h264', 'hevc', 'vp9', 'av1', 'mpeg2video', 'vc1'
          $requiredAudio = 'ac3', 'eac3', 'dca', 'truehd', 'flac', 'aac', 'opus', 'mp3'
          $missing = @()
          foreach ($c in $requiredVideo) { if ($video -notmatch [regex]::Escape($c)) { $missing += "video:$c" } }
          foreach ($c in $requiredAudio) { if ($audio -notmatch [regex]::Escape($c)) { $missing += "audio:$c" } }
          if ($missing.Count -gt 0) {
            throw "fetched mpv is missing expected decoders: $($missing -join ', ')"
          }
          Write-Host 'OK -- full video and audio codec set present, including TrueHD and DTS-HD MA (dca)'

      # The step above deliberately runs before mpv is on PATH, so it exercises `lumen setup`'s own
      # download path rather than short-circuiting on "mpv is already available". Only now, with
      # `target/debug/mpv.exe` fetched and proven, is it safe to put it on PATH and re-run
      # `remote_serve.rs` for real -- it self-skips otherwise, the same silent gap Linux and macOS
      # had before mpv was installed for them above. This is the Windows leg of the same fix.
      - name: Put the fetched mpv on PATH and re-run the real-mpv integration test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Content -Path $env:GITHUB_PATH -Value "$pwd\target\debug"

      - name: Test remote_serve with real mpv (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          command -v mpv || command -v mpv.exe
          cargo test -p lumen-play --test remote_serve -- --nocapture

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  licence-gate:
    name: licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The LGPL-only discipline from ADR-0002 is a shipping constraint, not a preference: a GPL
      # component makes the whole product GPL and forecloses the App Store. Checking it by hand is
      # how it stops being checked.
      - name: Run the licence gate
        run: |
          if [ -x ci/license-gate.sh ]; then
            ./ci/license-gate.sh
          else
            echo "ci/license-gate.sh missing or not executable" >&2
            exit 1
          fi
