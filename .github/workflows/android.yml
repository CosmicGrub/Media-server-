name: Android APK

# Builds a sideloadable APK and attaches it to the run as a downloadable artifact.
#
# This exists because the Android SDK cannot be fetched in every environment — dl.google.com is
# frequently blocked on locked-down networks — while a GitHub runner has it preinstalled. Push the
# branch and collect the APK from the run's Artifacts section; no Android Studio required.

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  # So a build can be triggered without pushing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # AGP 8.7 requires 17. The runner also has 21, but Gradle's toolchain resolution is
          # simpler when the JDK on PATH is the one the build targets.
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Accept SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # A debug keystore is not a secret — it is the same well-known key every Android developer's
      # machine generates, and its only purpose is to make the APK installable. Generating it here
      # rather than committing it keeps a key, even a worthless one, out of the repository.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Fast, no emulator: the posture decision and the formatting helpers are free functions over
      # primitives precisely so they can be checked here, in seconds, on every push.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      # Proof the APK is structurally sound and targets what it claims. A build that produces a file
      # nobody checked is how a broken manifest reaches a device.
      - name: Inspect the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          echo "=== badging ==="
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|native-code|application-label" || true
          echo "=== signature ==="
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          echo "=== size ==="
          ls -lh app/build/outputs/apk/*/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: lumen-android-apk
          path: android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  # A headless emulator. This is the only check that proves the APK installs and starts — a build
  # that compiles tells you nothing about whether the Activity survives to RESUMED, and a crash on
  # launch makes every other result irrelevant.
  #
  # Kept as a separate job because it is slow (booting an image takes minutes) and needs KVM, which
  # only the Linux runners have.
  emulator:
    name: on-device tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    strategy:
      fail-fast: false
      matrix:
        # 34 is what a Fold 5 ships with; 35 is what the app targets. Both, because the permission
        # model and the window APIs differ between them and a pass on one is not a pass on the other.
        api-level: [34, 35]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Without this the emulator falls back to software rendering and the boot times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run on-device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          # The emulator has no arm64 image; x86_64 is the only option on a CI runner. The app ships
          # arm64-only, so abiFilters is widened just for this job rather than in the shipped APK.
          arch: x86_64
          profile: pixel_6
          # No window, no audio, no boot animation — this is the headless part.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.injected.testOnly=false -PemulatorAbi=x86_64

      - name: Upload on-device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-report-api${{ matrix.api-level }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7
