# cargo-deny policy — the Rust half of ADR-0002's licence gate.
#
# The native AV stack is checked by ci/license-gate.sh; this covers the Cargo dependency graph.
# Copyleft licences on a Rust dependency would propagate to our own code exactly as a GPL FFmpeg
# build would, so they are denied rather than reviewed case by case.

[licenses]
# Permissive plus LGPL (which we already accept for the native stack, dynamically linked).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",          # our own licence: file-level copyleft, app-store compatible
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",             # doctest-file/recvmsg (via interprocess, the Windows named-pipe IPC
                         # transport) -- BSD Zero Clause, OSI-approved and more permissive than MIT,
                         # not previously caught because cargo-deny is opt-in locally (see
                         # ci/license-gate.sh) and had never actually been run against this graph.
]
# Anything not on the allow list fails, including unknown/unlicensed crates.
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Every internal crate is wired up via `name.workspace = true` + a `path = "crates/..."` entry in
# the root [workspace.dependencies] table, with no version req — that's a wildcard dependency as
# far as cargo-deny is concerned, and `wildcards = "deny"` flags all of them (cargo-deny's
# `allow-wildcard-paths` escape hatch only exempts crates marked `publish = false`, which ours
# aren't). Rather than mark every workspace member unpublishable just to satisfy this check,
# wildcards are left unchecked; the `[[bans.deny]]` list below (openssl) and
# `multiple-versions` still run.
wildcards = "allow"

[[bans.deny]]
# Roll-your-own crypto has no place in a network service that indexes people's private files.
name = "openssl"
wrappers = []

[advisories]
yanked = "deny"
unmaintained = "workspace"
# NOTE: `cargo deny check advisories` is not currently wired into ci/license-gate.sh. The
# workspace today carries pre-existing RUSTSEC vulnerabilities in rustls/rustls-webpki/time that
# need a dependency upgrade (a separate piece of work, not a licence-gate change) before this
# check can be enforced in CI without failing every PR on unrelated grounds. `check bans` and
# `check licenses` are enforced; this table documents intended policy for when that upgrade lands.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
